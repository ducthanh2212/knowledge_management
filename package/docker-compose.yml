version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: postgres-kbs
    environment:
      POSTGRES_DB: kbs_adaptive_exam
      POSTGRES_USER: kbs_user
      POSTGRES_PASSWORD: kbs_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbs_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kbs-network

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.15
    container_name: neo4j-kbs
    environment:
      NEO4J_AUTH: neo4j/12345678
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"  # HTTP Browser
      - "7687:7687"  # Bolt Protocol
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p 12345678 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kbs-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:

networks:
  kbs-network:
    driver: bridge
